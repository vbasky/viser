[package]
name = "viser-engine"
version = "0.12.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Engine-agnostic video encode/probe traits and shared media types for viser"
keywords = ["video", "encoding", "engine", "codec", "probe"]
categories = ["multimedia::video", "multimedia::encoding"]

[lib]
name = "viser_engine"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["sync", "process", "rt"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
