[package]
name = "viser-predict"
version = "0.10.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Feature-based ladder prediction for viser (no trial encodes)"
keywords = ["video", "encoding", "ladder", "prediction", "per-title"]
categories = ["algorithms", "multimedia::encoding", "multimedia::video"]

[lib]
name = "viser_predict"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
viser-complexity = { path = "../viser-complexity", version = "0.10.0" }
viser-encoding = { path = "../viser-encoding", version = "0.10.0" }
viser-ffmpeg = { path = "../viser-ffmpeg", version = "0.10.0" }
viser-hull = { path = "../viser-hull", version = "0.10.0" }
viser-ladder = { path = "../viser-ladder", version = "0.10.0" }
viser-pertitle = { path = "../viser-pertitle", version = "0.10.0" }
viser-quality = { path = "../viser-quality", version = "0.10.0" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }